# 工业相机默认参数。
# 启动命令中的同名参数会覆盖此处的默认值，例如 gain:=170。
industrial_animal_vision:
  ros__parameters:
    # 仅用于日志和显示界面标识。
    camera_profile: default

    # 相机 V4L2 稳定设备路径：12MP U3 Camera，USB 序列号 2601230002。
    # video-index0 是视频采集/MJPEG 接口；按设备序列号绑定，换 USB 口后仍可识别。
    camera_device: /dev/v4l/by-id/usb-12MP_U3_Camera_12MP_U3_Camera_2601230002-video-index0
    # 向相机请求的图像宽度，单位为像素。
    camera_width: 1280
    # 向相机请求的图像高度，单位为像素。
    camera_height: 720
    # 向相机请求的采集帧率；相机驱动不支持时会协商为实际可用档位。
    camera_fps: 120

    # MPP 解码后交给检测器的 RGB 图像宽度，单位为像素。
    decode_width: 1280
    # MPP 解码后交给检测器的 RGB 图像高度，单位为像素。
    # 模型输入仍是 640x640；检测器会进行 RGA letterbox 缩放。
    decode_height: 720

    # 曝光模式：1=手动；3=自动（部分驱动显示为光圈优先）。
    exposure_auto: 3
    # 手动曝光值，仅在 exposure_auto=1 时写入相机。
    exposure_absolute: 40
    # 0=自动曝光不允许降低帧率；1=允许降低帧率换取更亮画面。
    exposure_auto_priority: 0
    # 图像增益：越大越亮，同时噪点也越明显。
    gain: 190

    # 图像亮度，具体取值范围由相机驱动决定。
    brightness: 128
    # 图像明暗反差，具体取值范围由相机驱动决定。
    contrast: 65
    # 图像颜色饱和度，数值越大颜色通常越鲜艳。
    saturation: 90
    # 图像中间亮度校正值，不等同于曝光。
    gamma: 130
    # 图像锐化强度，过高可能放大噪点。
    sharpness: 128
    # 逆光补偿强度，用于主体背后存在强光的场景。
    backlight_compensation: 16

    # 自动白平衡：1=自动，0=手动。
    white_balance_auto: 1
    # 手动白平衡色温；仅在 white_balance_auto=0 时写入相机。
    white_balance_temperature: 4650
    # 防闪烁频率：0=关闭，1=50Hz，2=60Hz，3=自动（取决于驱动支持）。
    power_line_frequency: 1

    # 对焦：focus_auto=1 自动；设为 0 后 focus_absolute 才生效。
    focus_auto: 1
    # 手动焦点位置；仅在 focus_auto=0 时写入相机。
    focus_absolute: 0
    # 变焦值；具体对应光学还是数字变焦取决于相机。
    zoom_absolute: 120

    # 是否在香橙派桌面显示检测窗口。
    display_enabled: true
    # 最大显示刷新率；不会限制相机采集和 NPU 推理速度。
    display_fps_limit: 60.0

    # 最低检测置信度；提高可减少误检，但可能增加漏检。
    confidence_threshold: 0.5
    # NMS 重叠框抑制阈值；越低越容易合并重叠检测框。
    nms_threshold: 0.45

    # 向控制端发布视觉伺服目标的话题（QoS: SensorDataQoS / best_effort）。
    servo_target_topic: /vision/servo/target
    # 订阅控制端伺服状态的话题（QoS: reliable + transient_local）。
    servo_status_topic: /control/vision_servo/status
    # 目标发布频率；接口契约要求 20-30 Hz，最低持续 15 Hz。
    servo_publish_rate_hz: 25.0
    # 超过该秒数没有新的推理结果就发布 valid=false，绝不重发旧坐标。
    # 必须远小于控制端 lost_timeout_s(1.0s)，让视觉端先于控制端宣告目标丢失。
    servo_stale_timeout_s: 0.25
    # confirmed 置位所需的连续稳定命中帧数；不允许单帧检测直接置位。
    servo_confirm_min_hits: 5
    # 参与确认统计的最低单帧置信度；只影响 confirmed，不影响 valid。
    servo_confirm_min_score: 0.55
    # 单帧目标中心跳变上限（归一化到图像对角线）；超过则确认计数重置。
    servo_confirm_max_center_jump: 0.12
    # 单帧检测框面积变化倍率上限；超过则确认计数重置。
    servo_confirm_max_area_ratio: 1.8
    # 伺服联调日志周期，单位秒；0 表示关闭周期日志。
    servo_log_period_s: 1.0

    # 同一类别目标跨帧关联所需的最小检测框 IoU。
    track_iou_threshold: 0.3
    # 目标允许连续未检测到的最大采集帧数；窗口内重现会保持原 track_id。
    # 注意：按相机采集帧计数（camera_fps=120 时 15 帧仅约 0.125 秒）。
    # 视觉伺服要求 该值/camera_fps >= 控制端 lost_timeout_s(1.0s)，
    # 即 120fps 下约需 120；遮挡超过当前窗口后 track_id 会换新，
    # 控制端锁定的旧 ID 永远等不到，动作将以 target lost 超时失败。
    # 当前默认为旧值，板端实测遮挡表现后再调整。
    track_max_missed_frames: 15

    # 使用 RKNN 原生输入内存，FP16 模型建议保持 true。
    enable_zero_copy: true
    # 使用 RGA 硬件完成 1280x720 到模型 letterbox 有效区域的缩放。
    # 板端未安装 librga 或运行失败时会自动回退 OpenCV。
    enable_rga_preprocess: true
    # 将进程限制到 CPU4-7，并将三个推理线程分别绑定到 CPU5-7。
    cpu_affinity_enabled: true
