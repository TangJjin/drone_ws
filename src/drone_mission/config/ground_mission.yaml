  require_confirmed: true
  image_x_axis: "y"
  image_y_axis: "z"
  image_x_sign: -1.0
  image_y_sign: -1.0
  kp_x: 0.35
  ki_x: 0.0
  kd_x: 0.02
  kp_y: 0.35
  ki_y: 0.0
  kd_y: 0.02
  integral_limit: 0.5
  filter_alpha: 0.35
  enter_tolerance_x: 0.04
  enter_tolerance_y: 0.04
  exit_tolerance_x: 0.07
  exit_tolerance_y: 0.07
  settle_time_s: 0.6
  acquire_timeout_s: 5.0
  lost_timeout_s: 1.0
  overall_timeout_s: 20.0
  max_body_speed_mps: 0.20
  continue_on_timeout: true
  auto_start_mission: false
