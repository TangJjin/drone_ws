# Start at the takeoff circle, enter at the shifted A-B midpoint, then fly one 20-point oval.
mission:
  takeoff_altitude: 1.50
  actions:
    - type: "takeoff"
      altitude: 1.50

    - type: "hover"
      duration: 1.00

    # Point 01 - fly directly from the takeoff origin to the A-B midpoint
    - type: "move"
      frame: "world_body"
      position: [2.000, -0.750, 1.500]
      yaw: 0.000
    - type: "visual_servo"

    # Point 02 - A-B straight
    - type: "move"
      frame: "world_body"
      position: [2.406, -0.750, 1.500]
      yaw: 0.000
    - type: "visual_servo"

    # Point 03 - enter the upper arc
    - type: "move"
      frame: "world_body"
      position: [2.812, -0.753, 1.500]
      yaw: -0.082
    - type: "visual_servo"

    # Point 04 - upper arc
    - type: "move"
      frame: "world_body"
      position: [3.188, -0.891, 1.500]
      yaw: -0.624
    - type: "visual_servo"

    # Point 05 - upper arc
    - type: "move"
      frame: "world_body"
      position: [3.439, -1.204, 1.500]
      yaw: -1.165
    - type: "visual_servo"

    # Point 06 - upper arc
    - type: "move"
      frame: "world_body"
      position: [3.493, -1.601, 1.500]
      yaw: -1.706
    - type: "visual_servo"

    # Point 07 - upper arc
    - type: "move"
      frame: "world_body"
      position: [3.335, -1.970, 1.500]
      yaw: -2.247
    - type: "visual_servo"

    # Point 08 - leave the upper arc
    - type: "move"
      frame: "world_body"
      position: [3.009, -2.204, 1.500]
      yaw: -2.789
    - type: "visual_servo"

    # Point 09 - C-D straight
    - type: "move"
      frame: "world_body"
      position: [2.609, -2.250, 1.500]
      yaw: -3.142
    - type: "visual_servo"

    # Point 10 - C-D straight
    - type: "move"
      frame: "world_body"
      position: [2.203, -2.250, 1.500]
      yaw: -3.142
    - type: "visual_servo"

    # Point 11 - C-D straight
    - type: "move"
      frame: "world_body"
      position: [1.797, -2.250, 1.500]
      yaw: -3.142
    - type: "visual_servo"

    # Point 12 - C-D straight
    - type: "move"
      frame: "world_body"
      position: [1.391, -2.250, 1.500]
      yaw: -3.142
    - type: "visual_servo"

    # Point 13 - enter the lower arc
    - type: "move"
      frame: "world_body"
      position: [0.991, -2.204, 1.500]
      yaw: 2.789
    - type: "visual_servo"

    # Point 14 - lower arc
    - type: "move"
      frame: "world_body"
      position: [0.665, -1.970, 1.500]
      yaw: 2.247
    - type: "visual_servo"

    # Point 15 - lower arc
    - type: "move"
      frame: "world_body"
      position: [0.507, -1.601, 1.500]
      yaw: 1.706
    - type: "visual_servo"

    # Point 16 - lower arc
    - type: "move"
      frame: "world_body"
      position: [0.561, -1.204, 1.500]
      yaw: 1.165
    - type: "visual_servo"

    # Point 17 - lower arc
    - type: "move"
      frame: "world_body"
      position: [0.812, -0.891, 1.500]
      yaw: 0.624
    - type: "visual_servo"

    # Point 18 - leave the lower arc
    - type: "move"
      frame: "world_body"
      position: [1.188, -0.753, 1.500]
      yaw: 0.082
    - type: "visual_servo"

    # Point 19 - A-B straight
    - type: "move"
      frame: "world_body"
      position: [1.594, -0.750, 1.500]
      yaw: 0.000
    - type: "visual_servo"

    # Point 20 - close the oval at the A-B midpoint
    - type: "move"
      frame: "world_body"
      position: [2.000, -0.750, 1.500]
      yaw: 0.000
    - type: "visual_servo"

    - type: "hover"
      duration: 1.00

    - type: "land"

system:
  tolerance: 0.10
  yaw_tolerance_deg: 4.0
  max_xy_speed_mps: 0.50
  max_z_speed_mps: 0.30
  max_yaw_rate_deg_s: 40.0

  target_id: ""
  require_confirmed: true
  image_x_axis: "y"
  image_y_axis: "z"
  image_x_sign: -1.0
  image_y_sign: -1.0
  kp_x: 0.35
  ki_x: 0.0
  kd_x: 0.02
  kp_y: 0.35
  ki_y: 0.0
  kd_y: 0.02
  integral_limit: 0.5
  filter_alpha: 0.35
  enter_tolerance_x: 0.04
  enter_tolerance_y: 0.04
  exit_tolerance_x: 0.07
  exit_tolerance_y: 0.07
  settle_time_s: 0.6
  acquire_timeout_s: 5.0
  lost_timeout_s: 1.0
  overall_timeout_s: 20.0
  max_body_speed_mps: 0.20
  continue_on_timeout: true
  auto_start_mission: false
