# RealSense D435i驱动参数，由launch传递给realsense2_camera。
realsense:
  # 相机节点命名空间；与camera_name共同决定话题前缀。
  camera_namespace: camera

  # RealSense节点名称；默认生成/camera/camera/...话题。
  camera_name: camera

  # 固定librealsense识别的D435i序列号；前导下划线防止ROS解析成整数。
  serial_no: "_327122074056"

  # 是否启用RGB彩色流；RGBD消息必须开启。
  enable_color: true

  # RGB分辨率和帧率，格式为宽x高xFPS。
  rgb_camera.color_profile: "640x480x30"

  # RGB灯光防频闪频率；1表示50 Hz，避免D435i不支持默认Auto=3的警告。
  rgb_camera.power_line_frequency: 1

  # 是否启用深度流；RGBD消息必须开启。
  enable_depth: true

  # 深度分辨率和帧率，应与RGB保持一致。
  depth_module.depth_profile: "640x480x30"

  # 是否在驱动层同步RGB和深度帧。
  enable_sync: true

  # 是否发布realsense2_camera_msgs/msg/RGBD组合消息。
  enable_rgbd: true

  # 是否把深度图空间对齐到RGB像素坐标系。
  align_depth.enable: true

# 空地协同伺服调试节点参数。
air_ground_servo_node:
  ros__parameters:
    # RGBD组合消息话题。
    rgbd_topic: "/camera/camera/rgbd"

    # 期望RGB和深度图像宽度；不一致时显示红色警告。
    expected_width: 640

    # 期望RGB和深度图像高度；不一致时显示红色警告。
    expected_height: 480

    # 期望输入帧率，仅用于HUD目标值和低帧率判断。
    expected_fps: 30.0

    # 手工中心横坐标；仅用于启动参数自检，运行时采样改为检测到的靶标圆心。
    center_x: 320

    # 手工中心纵坐标；仅用于启动参数自检，运行时采样改为检测到的靶标圆心。
    center_y: 240

    # 中心深度采样窗口边长；10表示10x10像素。
    sample_window_size: 10

    # 允许接受的最小有效深度，单位米。
    min_depth_m: 0.1

    # 允许接受的最大有效深度，单位米。
    max_depth_m: 10.0

    # FPS指数平滑系数；越大越灵敏，越小越稳定。
    fps_smoothing_alpha: 0.1

    # OpenCV调试窗口名称。
    window_name: "Air-Ground Servo RGBD"

    # 是否显示OpenCV调试窗口。
    debug_view: true

    # 调试窗口显示模式；可选RGB、GRAY或BINARY，BINARY使用Otsu自动阈值。
    view_mode: "BINARY"

    # 重复警告日志的最小间隔，单位毫秒。
    log_throttle_ms: 2000

    # 有效靶标圆心的相机系三维坐标输出话题；靶标、深度或内参无效时不发布伪坐标。
    point_topic: "/air_ground_servo/target_point"

    # 外圆真实直径，单位米；与内圆直径共同限定椭圆配对的理论比例。
    outer_diameter_m: 0.50

    # 内圆真实直径，单位米；当前靶标为30 cm。
    inner_diameter_m: 0.30

    # 可参与fitEllipse的最小轮廓面积，单位像素平方；抑制小噪声轮廓。
    min_ellipse_area_px: 800.0

    # 允许椭圆的最大长短轴比；超过此值通常是透视过大或非圆形干扰。
    max_ellipse_aspect_ratio: 2.5

    # 内外椭圆中心允许的最大距离，占外椭圆长轴的比例。
    max_center_distance_ratio: 0.12

    # 外内长轴直径比相对理论50/30的最大相对误差。
    max_diameter_ratio_error: 0.25

    # 内外椭圆长短轴比允许的最大差值；同一圆平面投影后应相近。
    max_aspect_ratio_difference: 0.20

    # Canny边缘检测低阈值；与高阈值共同用于椭圆和十字线候选。
    canny_low_threshold: 50

    # Canny边缘检测高阈值；必须大于低阈值。
    canny_high_threshold: 150

    # HoughLinesP累积阈值；越高越严格，越低越容易检出干扰线。
    hough_threshold: 35

    # HoughLinesP允许的最短十字线段长度，单位像素。
    hough_min_line_length: 45

    # HoughLinesP连接同一直线断段的最大间隔，单位像素。
    hough_max_line_gap: 12

    # 线段判为水平或垂直的最大夹角，单位度。
    line_angle_tolerance_deg: 20.0

    # 十字线交点距椭圆中心的最大距离，占外椭圆长轴的比例；超过时不参与中心融合。
    max_cross_distance_ratio: 0.18
