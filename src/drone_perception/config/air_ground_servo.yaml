# RealSense D435i驱动参数，由launch传递给realsense2_camera。
realsense:
  # 相机节点命名空间；与camera_name共同决定话题前缀。
  camera_namespace: camera

  # RealSense节点名称；默认生成/camera/camera/...话题。
  camera_name: camera

  # 固定librealsense识别的D435i序列号；前导下划线防止ROS解析成整数。
  serial_no: "_327122074056"

  # 是否启用RGB彩色流；RGBD消息必须开启。
  enable_color: true

  # RGB分辨率和帧率，格式为宽x高xFPS。
  rgb_camera.color_profile: "640x480x30"

  # RGB灯光防频闪频率；1表示50 Hz，避免D435i不支持默认Auto=3的警告。
  rgb_camera.power_line_frequency: 1

  # 是否启用深度流；RGBD消息必须开启。
  enable_depth: true

  # 深度分辨率和帧率，应与RGB保持一致。
  depth_module.depth_profile: "640x480x30"

  # 是否在驱动层同步RGB和深度帧。
  enable_sync: true

  # 是否发布realsense2_camera_msgs/msg/RGBD组合消息。
  enable_rgbd: true

  # 是否把深度图空间对齐到RGB像素坐标系。
  align_depth.enable: true

# 空地协同伺服调试节点参数。
air_ground_servo_node:
  ros__parameters:
    # RGBD组合消息话题。
    rgbd_topic: "/camera/camera/rgbd"

    # 期望RGB和深度图像宽度；不一致时显示红色警告。
    expected_width: 640

    # 期望RGB和深度图像高度；不一致时显示红色警告。
    expected_height: 480

    # 期望输入帧率，仅用于HUD目标值和低帧率判断。
    expected_fps: 30.0

    # 手工中心横坐标；仅用于启动参数自检，运行时采样改为检测到的靶标圆心。
    center_x: 320

    # 手工中心纵坐标；仅用于启动参数自检，运行时采样改为检测到的靶标圆心。
    center_y: 240

    # 中心深度采样窗口边长；10表示10x10像素。
    sample_window_size: 10

    # 允许接受的最小有效深度，单位米。
    min_depth_m: 0.1

    # 允许接受的最大有效深度，单位米。
    max_depth_m: 10.0

    # FPS指数平滑系数；越大越灵敏，越小越稳定。
    fps_smoothing_alpha: 0.1

    # OpenCV调试窗口名称。
    window_name: "Air-Ground Servo RGBD"

    # 是否显示OpenCV调试窗口。
    debug_view: true

    # 调试窗口显示模式；BINARY显示与识别流程相同的黑色前景掩膜及候选轮廓。
    view_mode: "BINARY"

    # 重复警告日志的最小间隔，单位毫秒。
    log_throttle_ms: 2000

    # 控制端视觉伺服话题；发布VisionServoTarget，默认与现有控制端订阅话题一致。
    servo_topic: "/vision/servo/target"

    # 灰度图高斯模糊核尺寸；必须为大于等于3的奇数，用于抑制像素级噪声。
    gaussian_blur_kernel: 5

    # CLAHE局部对比度增强的裁剪阈值；越大越增强局部反差，也越容易放大噪声。
    clahe_clip_limit: 2.0

    # CLAHE局部直方图网格边长，单位像素。
    clahe_tile_grid_size: 8

    # 高斯自适应阈值窗口边长；必须为奇数，用于抑制不均匀光照。
    adaptive_threshold_block_size: 61

    # 自适应阈值常数C；增大可减少被判为黑色前景的区域。
    adaptive_threshold_c: 5.0

    # 内外环允许的最小半径，单位像素；排除十字中心附近的细小噪声。
    min_ring_radius_px: 20

    # 内外环允许的最大半径，单位像素；应覆盖当前高度下靶标外环。
    max_ring_radius_px: 220

    # 外椭圆轮廓最小圆度；越大越严格地拒绝非圆形轮廓。
    min_circularity: 0.45

    # 外椭圆短轴与长轴的最小比值；允许俯仰后的椭圆形变。
    min_axis_ratio: 0.60

    # 内环360度采样的最小黑色覆盖率；低于此值不视为双环。
    min_inner_ring_score: 0.40

    # 两条穿过椭圆中心的近似垂直直径黑线最小覆盖率；达到此值分类为小车靶标。
    min_cross_score: 0.45

    # 调试窗口保留的有效双环十字圆心历史点数量；以洋红色点显示，不连接为折线。
    trajectory_max_points: 80
